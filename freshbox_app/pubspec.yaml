name: freshbox_app
description: 冷蔵庫管理アプリ FreshBox - 賞味期限管理 & レシピ提案
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  flutter_riverpod: ^2.5.1

  # ローカルDB (永続化)
  hive_flutter: ^1.1.0

  # UI拡張・アニメーション
  flutter_animate: ^4.5.0

  # フォント (Noto Sans JP)
  google_fonts: ^6.2.1

  # ID生成
  uuid: ^4.3.3

  # 日付フォーマット
  intl: ^0.19.0

  # アイコン
  cupertino_icons: ^1.0.6

  # URL起動 (プライバシーポリシーリンク用)
  url_launcher: ^6.3.0

  # HTTP通信
  http: ^1.2.1

  # 画像・写真選択
  image_picker: ^1.1.2

  # ローカルプッシュ通知
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # アイコン生成
  flutter_launcher_icons: ^0.13.1
  # スプラッシュスクリーン
  flutter_native_splash: ^2.4.1

# アイコン設定
flutter_icons:
  ios: true
  android: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  min_ios_version: "16.0"
  web:
    generate: false

# スプラッシュスクリーン設定
flutter_native_splash:
  color: "#1B6B3A"
  color_dark: "#0D3D21"
  image: assets/images/splash_logo.png
  ios: true
  android: true
  android_12:
    color: "#1B6B3A"
    image: assets/images/splash_logo.png
  fullscreen: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
