name: Deploy web app to GitHub Pages

# FreshBox の Web 版をビルドして gh-pages ブランチに公開する。
# main への push（freshbox_app 配下の変更時）で自動実行。
# 手動実行も可（Actions タブ → Deploy web app to GitHub Pages → Run workflow）。
#
# 初回セットアップ（リポジトリ Settings → Pages）:
#   Source: Deploy from a branch / Branch: gh-pages / (root)
# ※ gh-pages ブランチはこのワークフローの初回実行で自動作成される。

on:
  push:
    branches: [main]
    paths:
      - 'freshbox_app/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing web scaffold files (icons, favicon)
        working-directory: freshbox_app
        run: flutter create --platforms web .

      - name: Build web
        working-directory: freshbox_app
        run: |
          flutter pub get
          flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Publish built site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: freshbox_app/build/web
          publish_branch: gh-pages
