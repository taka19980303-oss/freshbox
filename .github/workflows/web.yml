name: Deploy web app to GitHub Pages

# FreshBox の Web 版をビルドして GitHub Pages に公開する。
# main への push（freshbox_app 配下の変更時）で自動実行。
# 手動実行も可（Actions タブ → Deploy web app to GitHub Pages → Run workflow）。

on:
  push:
    branches: [main]
    paths:
      - 'freshbox_app/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing web scaffold files (icons, favicon)
        working-directory: freshbox_app
        run: flutter create --platforms web .

      - name: Build web
        working-directory: freshbox_app
        run: |
          flutter pub get
          flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: freshbox_app/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
